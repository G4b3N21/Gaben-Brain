<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gaben Brain" />

  <link rel="apple-touch-icon" href="./ikon.jpg" />
  <link rel="icon" type="image/jpeg" href="./ikon.jpg" />
  <title>Gaben Brain</title>

  <script>
    async function enablePersistentStorage() {
      if (navigator.storage && navigator.storage.persist) {
        await navigator.storage.persist();
      }
    }
    enablePersistentStorage();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>

  <style>
    :root {
      --bg: #0F172A;
      --card: #1E293B;
      --border: #334155;
      --text: #F1F5F9;
      --muted: #94A3B8;
      --lime: #94CF0C;
      --gift: #F59E0B;
      --danger: #EF4444;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px;
      min-height: 100vh;
    }

    .container { max-width: 600px; margin: 0 auto; padding: 16px 0 90px 0; }

    /* Header */
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 8px; flex-wrap: wrap; }
    .top-bar h2 { margin: 0; font-size: 22px; letter-spacing: 0.3px; }
    .lime-accent { color: var(--lime); text-shadow: 0 0 12px rgba(148, 207, 12, 0.35); }
    .top-actions { display: flex; gap: 6px; flex-wrap: wrap; }

    /* Inputs & Buttons */
    input, select, textarea {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px 13px;
      border-radius: 10px;
      font-size: 15px;
      margin-bottom: 12px;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--lime); }

    button {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { opacity: 0.7; }
    .btn-lime { background: var(--lime); border-color: var(--lime); color: #0F172A; font-weight: 800; }
    .btn-sm { padding: 6px 10px; font-size: 12px; }
    .btn-danger { color: var(--danger); border-color: rgba(239, 68, 68, 0.4); }

   /* Wrapping Project Pills */
    .boards-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 14px;
    }

    .board-pill {
      white-space: nowrap;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .board-pill.active {
      border-color: var(--lime);
      color: var(--lime);
      background: rgba(148, 207, 12, 0.08);
    }
    .board-pill[data-board="Gifts"].active {
      border-color: var(--gift);
      color: var(--gift);
      background: rgba(245, 158, 11, 0.08);
    }

    /* Idea Cards */
    .idea-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 4px solid var(--lime);
      border-radius: 12px;
      padding: 13px 14px;
      margin-bottom: 10px;
    }
    .idea-card[data-board="Gifts"] { border-left-color: var(--gift); }

    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
    .idea-title { font-size: 16px; font-weight: 700; line-height: 1.3; }
    .board-badge {
      font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px;
      background: var(--bg); color: var(--lime); border: 1px solid rgba(148, 207, 12, 0.3); flex-shrink: 0;
    }
    .board-badge.Gifts { color: var(--gift); border-color: rgba(245, 158, 11, 0.35); }

    .idea-tag {
      display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 6px;
      background: var(--bg); color: var(--muted); border: 1px solid var(--border); margin-bottom: 6px;
    }
    .idea-note { font-size: 13px; color: var(--muted); white-space: pre-wrap; margin-top: 4px; }

    .card-actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(51, 65, 85, 0.6); }

    /* Floating Add Button */
    .fab {
      position: fixed;
      bottom: calc(20px + env(safe-area-inset-bottom));
      right: 20px;
      background: var(--lime);
      color: #0F172A;
      border: none;
      border-radius: 50px;
      padding: 14px 22px;
      font-size: 16px;
      font-weight: 800;
      box-shadow: 0 6px 20px rgba(0,0,0,0.45);
    }

    /* Modals */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.88);
      display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50;
    }
    .modal {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      width: 100%; max-width: 460px; padding: 20px; max-height: 90vh; overflow-y: auto;
    }
    .modal h3 { margin: 0 0 14px 0; color: var(--lime); }
    .modal input, .modal select, .modal textarea { background: var(--bg); }
    .field-label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 4px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 10px; }
    .modal-actions button { flex: 1; padding: 11px; }

    .board-list-item {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--bg); padding: 8px 12px; border-radius: 8px; margin-bottom: 6px; border: 1px solid var(--border);
    }

    /* Toast */
    .toast {
      position: fixed; bottom: 85px; left: 50%; transform: translateX(-50%);
      background: var(--lime); color: #0F172A; font-weight: 800; padding: 8px 18px;
      border-radius: 20px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 100;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<div class="container">
  <div class="top-bar">
    <h2><span class="lime-accent">Gaben</span> Brain</h2>
    <div class="top-actions">
      <button class="btn-sm" onclick="openBoardsModal()">Projects</button>
      <button class="btn-sm" onclick="exportData()">Export</button>
      <button class="btn-sm" onclick="document.getElementById('importFile').click()">Import</button>
      <input type="file" id="importFile" accept=".json" onchange="importData(event)" style="display:none;" />
    </div>
  </div>

  <input type="text" id="searchInput" placeholder="Search ideas, projects, tags, or notes..." oninput="renderIdeas()" />

  <div class="boards-bar" id="boardsBar"></div>

  <div id="ideasList"></div>
</div>

<button class="fab" onclick="openIdeaModal()">+ Add Idea</button>

<!-- ADD / EDIT IDEA MODAL -->
<div id="ideaModalBackdrop" class="modal-backdrop">
  <div class="modal">
    <h3 id="ideaModalTitle">Add Idea</h3>
    <input type="hidden" id="editIdeaId" />

    <label class="field-label">Project / Board</label>
    <select id="ideaBoard"></select>

    <label class="field-label">Idea / Inspiration *</label>
    <input type="text" id="ideaTitle" placeholder="e.g. Red patterned rug / Anna - new fantasy book" />

    <label class="field-label">Tag / Person / Sub-topic (Optional)</label>
    <input type="text" id="ideaTag" placeholder="e.g. Anna, Lighting, Colors..." />

    <label class="field-label">Details / Notes (Optional)</label>
    <textarea id="ideaNote" rows="3" placeholder="Any extra thoughts, dimensions, or links..."></textarea>

    <div class="modal-actions">
      <button onclick="closeIdeaModal()">Cancel</button>
      <button class="btn-lime" onclick="saveIdea()">Save</button>
    </div>
  </div>
</div>

<!-- MANAGE PROJECTS MODAL -->
<div id="boardsModalBackdrop" class="modal-backdrop">
  <div class="modal">
    <h3>Manage Projects</h3>
    <div style="display: flex; gap: 8px; margin-bottom: 12px;">
      <input type="text" id="newBoardInput" placeholder="e.g. Jazz Club Room..." style="margin-bottom: 0;" />
      <input type="color" id="newBoardColor" value="#38BDF8" style="width: 48px; height: 42px; padding: 2px; margin-bottom: 0; cursor: pointer;" />
      <button class="btn-lime" onclick="addBoard()">Add</button>
    </div>
    <div id="boardsManageList"></div>
    <div class="modal-actions">
      <button onclick="closeBoardsModal()">Done</button>
    </div>
  </div>
</div>

<div id="toast" class="toast">Copied for Task app!</div>
<script>
  const IDEAS_KEY = 'gaben_brain_ideas_v1';
  const BOARDS_KEY = 'gaben_brain_boards_v1';

  const DEFAULT_BOARDS = ['Gifts', 'Jazz Club Room', 'Workshop', 'Random Ideas'];
  let ideas = JSON.parse(localStorage.getItem(IDEAS_KEY) || '[]');
  let boards = JSON.parse(localStorage.getItem(BOARDS_KEY) || 'null') || [...DEFAULT_BOARDS];
  let currentBoard = 'All';

  window.addEventListener('DOMContentLoaded', () => {
    renderBoardsBar();
    renderIdeas();
  });

  function saveAll() {
    localStorage.setItem(IDEAS_KEY, JSON.stringify(ideas));
    localStorage.setItem(BOARDS_KEY, JSON.stringify(boards));
  }

  function setBoard(board) {
    currentBoard = board;
    renderBoardsBar();
    renderIdeas();
  }

    let boardColors = JSON.parse(localStorage.getItem('gaben_brain_colors_v1') || '{"Gifts":"#F59E0B"}');

  function getBoardColor(boardName) {
    return boardColors[boardName] || '#94CF0C';
  }

  function renderBoardsBar() {
    const bar = document.getElementById('boardsBar');
    const allBoards = ['All', ...boards];
    bar.innerHTML = allBoards.map(b => {
      const count = b === 'All' ? ideas.length : ideas.filter(i => i.board === b).length;
      const isActive = currentBoard === b;
      const color = b === 'All' ? '#94CF0C' : getBoardColor(b);
      const style = isActive
        ? `border-color:${color}; color:${color}; background:${color}18;`
        : `border-left: 3px solid ${color};`;
      return `<button class="board-pill ${isActive ? 'active' : ''}" style="${style}" onclick="setBoard('${escapeJs(b)}')">${escapeHtml(b)} (${count})</button>`;
    }).join('');
  }

  function copyForTask(id) {
    const item = ideas.find(i => i.id === id);
    if (!item) return;
    const parts = [`[${item.board}]`, item.tag ? `(${item.tag})` : '', item.title, item.note ? `- ${item.note}` : ''].filter(Boolean);
    navigator.clipboard.writeText(parts.join(' ')).then(() => {
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1800);
    });
  }

  function renderIdeas() {
    const listEl = document.getElementById('ideasList');
    const query = document.getElementById('searchInput').value.trim().toLowerCase();

    const filtered = ideas.filter(item => {
      const matchBoard = query ? true : (currentBoard === 'All' || item.board === currentBoard);
      const haystack = `${item.title} ${item.board} ${item.tag || ''} ${item.note || ''}`.toLowerCase();
      return matchBoard && haystack.includes(query);
    });

    if (filtered.length === 0) {
      listEl.innerHTML = `<p style="text-align:center; color: var(--muted); margin-top: 40px;">No ideas here yet. Tap "+ Add Idea" to capture a thought!</p>`;
      return;
    }

    listEl.innerHTML = filtered.map(item => {
            const tagHtml = item.tag ? `<div class="idea-tag"># ${escapeHtml(item.tag)}</div>` : '';
      const noteHtml = item.note ? `<div class="idea-note">${escapeHtml(item.note)}</div>` : '';
      const color = getBoardColor(item.board);

      return `
        <div class="idea-card" style="border-left-color: ${color};">
          <div class="card-top">
            <div class="idea-title">${escapeHtml(item.title)}</div>
            <span class="board-badge" style="color: ${color}; border-color: ${color}55;">${escapeHtml(item.board)}</span>
          </div>
          ${tagHtml}
          ${noteHtml}
          <div class="card-actions">
            <button class="btn-sm" onclick="copyForTask('${item.id}')">Copy</button>
            <button class="btn-sm" onclick="openIdeaModal('${item.id}')">Edit</button>
            <button class="btn-sm btn-danger" onclick="deleteIdea('${item.id}')">Delete</button>
          </div>
        </div>
      `;
    }).join('');
  }

   
  function openIdeaModal(id = null) {
    document.getElementById('editIdeaId').value = id || '';
    document.getElementById('ideaModalTitle').textContent = id ? 'Edit Idea' : 'Add Idea';

    const boardSel = document.getElementById('ideaBoard');
    boardSel.innerHTML = boards.map(b => `<option value="${escapeHtml(b)}">${escapeHtml(b)}</option>`).join('');

    if (id) {
      const item = ideas.find(i => i.id === id);
      boardSel.value = item.board;
      document.getElementById('ideaTitle').value = item.title;
      document.getElementById('ideaTag').value = item.tag || '';
      document.getElementById('ideaNote').value = item.note || '';
    } else {
      boardSel.value = currentBoard !== 'All' ? currentBoard : boards;
      document.getElementById('ideaTitle').value = '';
      document.getElementById('ideaTag').value = '';
      document.getElementById('ideaNote').value = '';
    }
    document.getElementById('ideaModalBackdrop').style.display = 'flex';
  }

  function closeIdeaModal() {
    document.getElementById('ideaModalBackdrop').style.display = 'none';
  }

  function saveIdea() {
    const title = document.getElementById('ideaTitle').value.trim();
    if (!title) return alert('Please enter an idea.');

    const id = document.getElementById('editIdeaId').value || Date.now().toString();
    const entry = {
      id,
      board: document.getElementById('ideaBoard').value,
      title,
      tag: document.getElementById('ideaTag').value.trim(),
      note: document.getElementById('ideaNote').value.trim()
    };

    const idx = ideas.findIndex(i => i.id === id);
    if (idx > -1) ideas[idx] = entry;
    else ideas.unshift(entry);

    saveAll();
    closeIdeaModal();
    renderBoardsBar();
    renderIdeas();
  }

  function deleteIdea(id) {
    if (!confirm('Remove this idea?')) return;
    ideas = ideas.filter(i => i.id !== id);
    saveAll();
    renderBoardsBar();
    renderIdeas();
  }

  // Projects / Boards Management
  function openBoardsModal() {
    renderBoardsManageList();
    document.getElementById('boardsModalBackdrop').style.display = 'flex';
  }

  function closeBoardsModal() {
    document.getElementById('boardsModalBackdrop').style.display = 'none';
    renderBoardsBar();
    renderIdeas();
  }

  function renderBoardsManageList() {
    document.getElementById('boardsManageList').innerHTML = boards.map((b, idx) => `
      <div class="board-list-item">
        <span>${escapeHtml(b)}</span>
        ${b === 'Gifts' ? '<span style="font-size:11px; color:var(--gift);">Pinned</span>' : `<button class="btn-sm btn-danger" onclick="removeBoard(${idx})">Remove</button>`}
      </div>
    `).join('');
  }

  function addBoard() {
    const input = document.getElementById('newBoardInput');
    const val = input.value.trim();
    if (!val || boards.includes(val)) return;
    boards.push(val);
    input.value = '';
    saveAll();
    renderBoardsManageList();
  }

  function removeBoard(idx) {
    const removed = boards[idx];
    if (currentBoard === removed) currentBoard = 'All';
    boards.splice(idx, 1);
    saveAll();
    renderBoardsManageList();
  }

  // Export & Import
  function exportData() {
    const payload = JSON.stringify({ ideas, boards }, null, 2);
    const blob = new Blob([payload], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `gaben-brain-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function importData(event) {
    const file = event.target.files;
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const parsed = JSON.parse(e.target.result);
        if (Array.isArray(parsed.ideas)) {
          ideas = parsed.ideas;
          if (Array.isArray(parsed.boards) && parsed.boards.length) {
            boards = parsed.boards;
          }
          saveAll();
          renderBoardsBar();
          renderIdeas();
          alert('Brain backup imported successfully!');
        }
      } catch (err) {
        alert('Invalid backup file.');
      }
      event.target.value = '';
    };
    reader.readAsText(file);
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
  }
  function escapeJs(str) {
    return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
  }
</script>
</body>
</html>
